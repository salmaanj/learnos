name: learnos_mobile
description: LearnOS LMS Mobile App — Flutter

publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # HTTP & API
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  razorpay_flutter: ^1.3.7

  # Secure Storage (JWT token)
  flutter_secure_storage: ^9.0.0

  # Navigation
  go_router: ^13.2.0

  # UI Components
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  fl_chart: ^0.67.0

  # Video Player
  video_player: ^2.9.2
  chewie: ^1.8.5
  youtube_player_flutter: ^9.1.1

  # PDF Viewer
  flutter_pdfview: ^1.3.2
  path_provider: ^2.1.4
  webview_flutter: ^4.10.0

  # Media & Files
  image_picker: ^1.1.1
  file_picker: ^8.0.3

  # Utils
  intl: ^0.19.0
  timeago: ^3.6.1
  url_launcher: ^6.2.5
  share_plus: ^11.0.0
  connectivity_plus: ^6.0.3

  # Local notifications
  flutter_local_notifications: ^17.2.1+2

  # OTP input
  pinput: ^5.0.0

  # Svg support
  flutter_svg: ^2.0.10+1
  drift: ^2.32.1
  drift_flutter: ^0.3.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.32.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/learnos-icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21