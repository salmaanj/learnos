spring:
  application:
    name: learnos-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/learnos_db
    username: postgres
    password: sa
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  redis:
    host: localhost
    port: 6379
    timeout: 2000ms

  mail:
    host: smtp.sendgrid.net
    port: 587
    username: apikey
    password: ${SENDGRID_API_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  frontend-url: http://localhost:4200
  mobile-deep-link: learnos://
  otp-expiry-minutes: 10
  max-login-attempts: 5
  upload-dir: uploads
  mail-from: ${MAIL_FROM:noreply@learnos.in}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080
  servlet:
    context-path: /api/v1

jwt:
  secret: learnos_super_secret_key_2026_change_this_in_production_min_256_bits
  expiration: 86400000
  refresh-expiration: 604800000

aws:
  s3:
    bucket-name: learnos-content
    region: ap-south-1
    access-key: your_aws_access_key
    secret-key: your_aws_secret_key
    cloudfront-domain: https://your-cloudfront-id.cloudfront.net

razorpay:
  mode: test
  key-id: rzp_test_TcevYMBbqS8oek
  key-secret: t3hvXBOp5gygKGxRxe7xHB1F
  webhook-secret: ""

agora:
  app-id: your_agora_app_id
  app-certificate: your_agora_app_certificate
  token-expiry: 3600

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

logging:
  level:
    com.learnos: DEBUG
    org.springframework.security: INFO

storage:
  local:
    base-path: uploads
    base-url: http://localhost:8080/api/v1/files
