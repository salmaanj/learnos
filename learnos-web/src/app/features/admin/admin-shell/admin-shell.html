<div class="app-layout">
  <aside class="sidebar">
    <div class="sb-brand">
      <img
        class="sb-logo"
        src="/learnos-icon.jpg"
        alt="LearnOS"
      />

      <div class="sb-brand-text">
        <div class="sb-name">
          LearnOS
        </div>

        <div class="sb-sub">
          {{ companyName }}
        </div>

        <span class="sb-user">
          {{ userRole }} • {{ userName }}
        </span>
      </div>
    </div>

    <nav class="sb-nav">
      <ng-container
        *ngFor="let group of navItems"
      >
        <ng-container
          *ngIf="!group.adminOnly || canViewCompanyManagement"
        >
          <ng-container
            *ngIf="
              group.items.length > 0 &&
              group.items.some(
                item => shouldShowNavItem(item.label)
              )
            "
          >
            <div class="sb-section">
              {{ group.section }}
            </div>

            <ng-container
              *ngFor="let item of group.items"
            >
              <a
                *ngIf="shouldShowNavItem(item.label)"
                class="sb-item"
                [routerLink]="
                  item.label === 'Plans'
                    ? getNavRoute(item.label)
                    : item.route
                "
                routerLinkActive="active"
                [routerLinkActiveOptions]="{
                  exact: item.exact
                }"
              >
                <span class="sb-dot"></span>

                <span>
                  {{ item.label }}
                </span>
              </a>
            </ng-container>
          </ng-container>
        </ng-container>
      </ng-container>
    </nav>

    <footer class="sb-footer">
      <button
        type="button"
        class="btn btn-primary sb-logout"
        (click)="logout()"
      >
        Logout
      </button>
    </footer>
  </aside>

  <main class="main-area">
    <header class="topbar">
      <h1 class="topbar-title">
        {{ pageTitle }}
      </h1>

      <div class="topbar-actions">
        <div
          *ngIf="companyLogoUrl"
          class="topbar-company-logo"
          [title]="companyName"
        >
          <img
            [src]="companyLogoUrl"
            [alt]="companyName + ' logo'"
            (error)="onCompanyLogoError()"
          />
        </div>

        <a
          *ngIf="showActionButton"
          class="btn btn-primary"
          [routerLink]="actionRoute"
        >
          {{ actionLabel }}
        </a>
      </div>
    </header>

    <section class="content">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
